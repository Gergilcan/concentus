# LiteLLM — presents the local Ollama models in Anthropic and OpenAI formats.
#
# Only needed for the `local-ai` compose profile. Concentus's own self-hosted backend does NOT go
# through here: it speaks OpenAI-format to Ollama directly (LOCAL_MODEL_BASE_URL). This exists so
# that the `claude` CLI — which speaks Anthropic's format and nothing else — can also be pointed at
# a local model, and so Open WebUI has one gateway to talk to rather than two.
#
# To route the CLI here, set on the backend service:
#   ANTHROPIC_BASE_URL: http://litellm:4000
#   ANTHROPIC_AUTH_TOKEN: ${LITELLM_MASTER_KEY}
# Be clear-eyed about what that means: Claude Code's agent loop driving a 14B model. It works, but
# tool-calling discipline is the first thing to suffer.

model_list:
  # The chat model. `claude-*` aliases exist so a flow naming a Claude model can be pointed here
  # without editing the flow — useful for a side-by-side comparison, misleading if you forget.
  - model_name: qwen3
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://ollama:11434

  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://ollama:11434

  # Embeddings, for anything that wants them through the gateway. Concentus asks Ollama directly.
  - model_name: bge-m3
    litellm_params:
      model: ollama/bge-m3
      api_base: http://ollama:11434

litellm_settings:
  # A local model has no per-token bill; a spend log here would only be noise.
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
