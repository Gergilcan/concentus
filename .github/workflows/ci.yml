name: CI

on:
  push:
  pull_request:

env:
  # Must match embedded-postgres-binaries.version in apps/backend/pom.xml. pgvector is compiled
  # against these server headers, and a library built for one major version will not load into
  # another — a mismatch fails at CREATE EXTENSION, not at build time.
  PG_MAJOR: "17"
  PG_FULL: "17.5"
  PGVECTOR_VERSION: "0.8.0"

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: mvn verify
        working-directory: apps/backend
        run: mvn -q -B verify

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter frontend typecheck

      - name: Test
        run: pnpm --filter frontend test

      # Explicit file paths, not directories: node --test on a bare directory is unreliable on
      # Windows Node, so this is the exact command developers run locally too — CI stays honest
      # about what "green" means.
      - name: License tooling tests
        run: node --test apps/website/api/_lib/license-format.test.mjs packaging/license/mint-license.test.mjs

      - name: Build
        run: pnpm --filter frontend build

  desktop:
    name: Desktop shell (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck only. Building an actual installer needs a JDK, a jlink runtime and platform
      # PostgreSQL binaries, which is what the release workflow does — too slow to run on every
      # push, and it would catch nothing this does not.
      - name: Typecheck
        run: pnpm --filter desktop typecheck

  ui:
    name: UI (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The UI tests run against the real jar — the frontend is baked into it, so the build order
      # here is the same one the release uses: frontend first, then the backend that carries it.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: pnpm/action-setup@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Build backend jar
        working-directory: apps/backend
        run: mvn -B -q clean package -DskipTests

      - name: Install Playwright Chromium
        working-directory: apps/frontend
        run: pnpm exec playwright install --with-deps chromium

      # Parallel by worker: each Playwright worker starts its own backend (e2e/backend.ts) — the
      # jar, an embedded PostgreSQL, a scratch data directory — so tests parallelise without
      # sharing state. The same stack a user runs, which is the point of the suite.
      - name: UI tests
        working-directory: apps/frontend
        run: pnpm test:e2e

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          if-no-files-found: ignore

  pgvector:
    name: pgvector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both mac architectures, same as the release: the dylib is per-arch native code, so each
        # is its own way to break.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5

      # Built here, on every push, even though only the release workflow ships the result.
      #
      # It is native code compiled per platform against PostgreSQL's server headers, which makes it
      # the part of the build most likely to break and the part least likely to be noticed: nothing
      # else exercises it, and a failure at release time is a failure while cutting a release. This
      # job is the difference between finding that out now and finding it out then.
      #
      # Required, as it is in the release workflow. An installer is supposed to contain the
      # extension, so a build that cannot produce it is a failure in both places.
      - name: Build pgvector
        uses: ./.github/actions/build-pgvector
        with:
          pg-major: ${{ env.PG_MAJOR }}
          pg-full: ${{ env.PG_FULL }}
          pgvector-version: ${{ env.PGVECTOR_VERSION }}

      # Downloadable from the run, so the extension can be tried against a real database without
      # waiting for a release.
      - name: Upload the extension
        uses: actions/upload-artifact@v5
        with:
          # runner.arch as well as os — the two mac builds would otherwise collide on one name.
          name: pgvector-${{ runner.os }}-${{ runner.arch }}
          path: apps/backend/src/main/resources/pgvector/
          if-no-files-found: error
