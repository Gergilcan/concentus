name: Release

# Tag a version to cut a release:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# A prerelease MUST be dotted — v0.1.1-rc.1, never v0.1.1-rc1 — and the job below refuses the
# glued form rather than shipping it. electron-updater derives the update channel from
# `semver.prerelease(version)[0]`: dotted gives "rc" for every release in the train, glued gives
# "rc1", "rc2", … so each release becomes its own channel and no install is ever offered the next
# one. That is not theoretical — it is why v0.1.0-rc2 through rc16 never updated anyone.
#
# Mind the ordering when changing the shape: prerelease identifiers compare as strings, and
# "rc" < "rc16", so 0.1.0-rc.17 is OLDER than 0.1.0-rc16. Moving from the glued form to the dotted
# one has to bump the base version too (0.1.0-rc16 -> 0.1.1-rc.1).
#
# Manual runs build the installers and leave them as artifacts without publishing anything, which
# is how to check a packaging change without spending a version number on it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed to create the release and upload assets to it.
permissions:
  contents: write

env:
  # Must match the major version of embedded-postgres-binaries.version in apps/backend/pom.xml.
  # pgvector is compiled against these server headers, and a library built for one major version
  # will not load into another.
  PG_MAJOR: "17"
  # The full version, for the Windows binaries download. Keep both in step with
  # embedded-postgres-binaries.version in apps/backend/pom.xml.
  PG_FULL: "17.5"
  PGVECTOR_VERSION: "0.8.0"

jobs:
  installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not throw away the other's build — a Linux packaging problem
      # is no reason to be left without a Windows installer to test.
      fail-fast: false
      matrix:
        include:
          # The latest*.yml feeds and the .blockmaps ship WITH the installers, not as an extra:
          # electron-updater reads latest.yml to learn a newer version exists and diffs against
          # the blockmap to download only what changed. Releases used to carry only the
          # installers, so every installed app checked for updates against a feed that was not
          # there — auto-update existed and never updated anyone.
          - os: windows-latest
            name: Windows installer
            artifact: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.exe.blockmap
              apps/desktop/release/latest.yml
          - os: ubuntu-latest
            name: Linux installers
            artifact: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/latest-linux.yml

    steps:
      - uses: actions/checkout@v5

      # Fails the release before anything is built, because the alternative is an installer that
      # looks fine and updates nobody — a defect only visible months later, in other people's
      # installs. See the note at the top of this file.
      - name: Refuse a glued prerelease tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ -[A-Za-z]+[0-9]+$ ]]; then
            echo "::error::Tag $tag glues its prerelease to a number, which gives every release its"
            echo "::error::own electron-updater channel and breaks auto-update. Use a dot:"
            echo "::error::  ${tag%%-*}-rc.N"
            exit 1
          fi

      # Zulu rather than Temurin, for one specific reason: the payload script builds the bundled
      # runtime with jlink, and jlink needs the JDK's `jmods` directory. The Temurin 25 build this
      # workflow was getting does not ship one, so the first release failed after the jar had
      # already been built. Zulu includes it.
      #
      # A missing jmods no longer stops the build — prepare-payload.mjs falls back to copying the
      # whole JDK — but that fallback exists for a bad day, not as the normal path: it produces a
      # noticeably larger installer.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
          cache: maven

      # Cheap, and answers the question above directly in the log instead of leaving it to be
      # inferred from a failure ten minutes later.
      - name: Check the JDK can trim a runtime
        shell: bash
        run: |
          if [ -d "$JAVA_HOME/jmods" ]; then
            echo "jmods present ($(ls "$JAVA_HOME/jmods" | wc -l) modules) — jlink will trim the runtime."
          else
            echo "::warning::$JAVA_HOME has no jmods; the whole JDK will be bundled and the installer will be larger."
          fi

      - uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      # Compiled here because it cannot be compiled anywhere else: it is C, built against the
      # PostgreSQL server headers, for one OS and one major version. It has to run BEFORE the jar
      # is packaged — it stages into src/main/resources, so `mvn package` carries it into the jar
      # and the jar into the installer. That is what makes the extension part of what a user
      # installs rather than something they fetch.
      #
      # Required, not continue-on-error. It was the latter on the reasoning that an installer
      # without semantic ranking beats no installer — but that silently ships an .exe missing a
      # feature it is supposed to contain, and nobody would notice until a user's log said the
      # build carried none. CI now compiles this on every push, so a break is caught long before a
      # release; by the time a tag is cut, a failure here is a real problem and should stop.
      - name: Build pgvector
        uses: ./.github/actions/build-pgvector
        with:
          pg-major: ${{ env.PG_MAJOR }}
          pg-full: ${{ env.PG_FULL }}
          pgvector-version: ${{ env.PGVECTOR_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Order matters: the frontend is copied into the jar as static resources, so it has to exist
      # before Maven packages. This is what puts the UI, /api and /ws on one origin.
      - name: Build frontend
        run: pnpm --filter frontend build

      # The PostgreSQL binaries inside the jar are platform-specific and selected by an
      # OS-activated Maven profile, so this jar is only valid for the runner that built it. That
      # is why the whole build runs per platform rather than building one jar and packaging it
      # twice.
      # Tests are CI's job, not this one's. Running them here again buys nothing — the commit being
      # tagged has already been through them — and it makes cutting a release depend on the test
      # suite working in an environment it was never meant to run in. That is not hypothetical: the
      # store tests need a real PostgreSQL, and PostgreSQL refuses to start under the
      # administrative account GitHub's Windows runner uses, so the release failed on a platform
      # difference that had nothing to do with packaging.
      - name: Build backend jar
        working-directory: apps/backend
        run: mvn -B -q clean package -DskipTests

      # electron-builder stamps the artifacts and the update feed with package.json's version,
      # which sat at a fixed 1.0.0 while releases were tagged v0.1.0-rcN — so every release
      # claimed to BE 1.0.0, and the auto-updater, comparing 1.0.0 against 1.0.0, never offered
      # anyone anything. The tag is the truth about a release's version; stamp it here, at build
      # time only (nothing is committed). A prerelease tag (v0.1.0-rc6) also stamps a prerelease
      # version, which is exactly what makes electron-updater follow prereleases on installs of
      # one: its allowPrerelease defaults to true precisely when the installed version carries a
      # prerelease component.
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build installer
        working-directory: apps/desktop
        # electron-builder picks the current platform's targets from electron-builder.yml.
        run: pnpm package

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v5
        with:
          name: concentus-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish release
    # Only for a tag. A manual run stops after the artifacts above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          # Flattened from the per-platform artifact folders.
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          # A tag with a suffix (v1.0.0-rc1, v0.1.0-beta) is published as a pre-release, so trying
          # the pipeline out does not put a build people will take as final at the top of the
          # releases page. A plain v1.0.0 is a normal release.
          prerelease: ${{ contains(github.ref_name, '-') }}
