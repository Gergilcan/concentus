name: Release

# Tag a version to cut a release:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Manual runs build the installers and leave them as artifacts without publishing anything, which
# is how to check a packaging change without spending a version number on it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed to create the release and upload assets to it.
permissions:
  contents: write

env:
  # Must match the major version of embedded-postgres-binaries.version in apps/backend/pom.xml.
  # pgvector is compiled against these server headers, and a library built for one major version
  # will not load into another.
  PG_MAJOR: "17"
  # The full version, for the Windows binaries download. Keep both in step with
  # embedded-postgres-binaries.version in apps/backend/pom.xml.
  PG_FULL: "17.5"
  PGVECTOR_VERSION: "0.8.0"

jobs:
  installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not throw away the other's build — a Linux packaging problem
      # is no reason to be left without a Windows installer to test.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows installer
            artifact: "apps/desktop/release/*.exe"
          - os: ubuntu-latest
            name: Linux installers
            artifact: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb

    steps:
      - uses: actions/checkout@v4

      # A full JDK, not a JRE: the payload script needs jlink and the jmods directory to build the
      # runtime that ships inside the installer.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      # --- pgvector -------------------------------------------------------------------------
      # Compiled here because it cannot be compiled anywhere else: it is C, built against the
      # PostgreSQL server headers, for one OS and one major version. The result is copied into the
      # embedded server at startup (see PgVectorInstaller) so `create extension vector` works and
      # MCP tool search can rank by meaning instead of word overlap.
      #
      # Both steps are `continue-on-error`. Losing semantic ranking is a degraded feature that the
      # app already handles and reports; losing the installer over it would be the wrong trade.
      - name: Build pgvector (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -euo pipefail
          # The server headers, matching the major version embedded in the app. Ubuntu's own
          # repositories carry an older PostgreSQL, so the headers come from PGDG — building
          # against the wrong major produces a library the server will refuse to load.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-server-dev-${PG_MAJOR} build-essential
          pg_config --version
          git clone --branch "v${PGVECTOR_VERSION}" --depth 1 https://github.com/pgvector/pgvector.git /tmp/pgvector
          make -C /tmp/pgvector OPTFLAGS=""
          dest="apps/backend/src/main/resources/pgvector/linux-amd64"
          mkdir -p "$dest"
          cp /tmp/pgvector/vector.so "$dest/"
          cp /tmp/pgvector/vector.control "$dest/"
          cp /tmp/pgvector/sql/*.sql "$dest/"
          # PgVectorInstaller reads this: a jar is not a directory it can list portably.
          (cd "$dest" && ls *.sql > sql-files.txt)
          ls -la "$dest"

      # Two steps, because the headers have to be fetched before the compiler is set up.
      # Deliberately NOT the PostgreSQL the runner ships: that is whatever version the image
      # happens to carry, and a library built against a different major will not load into the
      # one the app embeds.
      - name: Fetch PostgreSQL ${{ env.PG_MAJOR }} headers (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $url = "https://get.enterprisedb.com/postgresql/postgresql-$env:PG_FULL-1-windows-x64-binaries.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\pg.zip"
          Expand-Archive "$env:RUNNER_TEMP\pg.zip" -DestinationPath "$env:RUNNER_TEMP\pg"
          # The archive unpacks to a `pgsql` folder holding bin, include and lib.
          "PGROOT=$env:RUNNER_TEMP\pg\pgsql" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$env:RUNNER_TEMP\pg\pgsql\bin\pg_config.exe" --version

      - name: Build pgvector (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          git clone --branch v%PGVECTOR_VERSION% --depth 1 https://github.com/pgvector/pgvector.git "%RUNNER_TEMP%\pgvector" || exit /b 1
          cd /d "%RUNNER_TEMP%\pgvector"
          REM PGROOT was exported by the previous step and is what Makefile.win reads.
          nmake /F Makefile.win || exit /b 1
          set "DEST=%GITHUB_WORKSPACE%\apps\backend\src\main\resources\pgvector\windows-amd64"
          mkdir "%DEST%"
          copy vector.dll "%DEST%\" || exit /b 1
          copy vector.control "%DEST%\" || exit /b 1
          copy sql\*.sql "%DEST%\" || exit /b 1
          cd /d "%DEST%"
          dir /b *.sql > sql-files.txt
          dir

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Order matters: the frontend is copied into the jar as static resources, so it has to exist
      # before Maven packages. This is what puts the UI, /api and /ws on one origin.
      - name: Build frontend
        run: pnpm --filter frontend build

      # The PostgreSQL binaries inside the jar are platform-specific and selected by an
      # OS-activated Maven profile, so this jar is only valid for the runner that built it. That
      # is why the whole build runs per platform rather than building one jar and packaging it
      # twice.
      - name: Build backend jar
        working-directory: apps/backend
        run: mvn -B -q clean package

      - name: Build installer
        working-directory: apps/desktop
        # electron-builder picks the current platform's targets from electron-builder.yml.
        run: pnpm package

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: concentus-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish release
    # Only for a tag. A manual run stops after the artifacts above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          # Flattened from the per-platform artifact folders.
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          # A tag with a suffix (v1.0.0-rc1, v0.1.0-beta) is published as a pre-release, so trying
          # the pipeline out does not put a build people will take as final at the top of the
          # releases page. A plain v1.0.0 is a normal release.
          prerelease: ${{ contains(github.ref_name, '-') }}
