name: Build pgvector
description: >
  Compiles the pgvector extension for the runner's platform and stages it where the backend jar
  picks it up (apps/backend/src/main/resources/pgvector/<os>-<arch>).

  Shared by the release workflow, which ships the result, and by CI, which builds it on every push
  so a break is found then rather than while cutting a release.

inputs:
  pg-major:
    description: PostgreSQL major version to compile against. Must match embedded-postgres-binaries.version.
    required: true
  pg-full:
    description: Full PostgreSQL version, for the Windows binaries download.
    required: true
  pgvector-version:
    description: pgvector release tag, without the leading v.
    required: true

runs:
  using: composite
  steps:
    # Deliberately NOT the PostgreSQL each runner image happens to ship: a library compiled against
    # a different major will not load, and it fails at CREATE EXTENSION rather than at build time —
    # the worst place to find out.
    - name: Install PostgreSQL ${{ inputs.pg-major }} headers (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # Ubuntu's own repositories carry an older major, so the headers come from PGDG.
        curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
          | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
        echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt-get update
        sudo apt-get install -y postgresql-server-dev-${{ inputs.pg-major }} build-essential
        pg_config --version

    - name: Build pgvector (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        git clone --branch "v${{ inputs.pgvector-version }}" --depth 1 \
          https://github.com/pgvector/pgvector.git /tmp/pgvector
        make -C /tmp/pgvector OPTFLAGS=""
        dest="apps/backend/src/main/resources/pgvector/linux-amd64"
        mkdir -p "$dest"
        cp /tmp/pgvector/vector.so "$dest/"
        cp /tmp/pgvector/vector.control "$dest/"
        cp /tmp/pgvector/sql/*.sql "$dest/"
        # PgVectorInstaller reads this: a jar is not a directory it can list portably.
        (cd "$dest" && ls *.sql > sql-files.txt)
        ls -la "$dest"

    - name: Fetch PostgreSQL ${{ inputs.pg-major }} headers (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $url = "https://get.enterprisedb.com/postgresql/postgresql-${{ inputs.pg-full }}-1-windows-x64-binaries.zip"
        Write-Host "Downloading $url"
        Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\pg.zip"
        Expand-Archive "$env:RUNNER_TEMP\pg.zip" -DestinationPath "$env:RUNNER_TEMP\pg"
        # The archive unpacks to a `pgsql` folder holding bin, include and lib.
        "PGROOT=$env:RUNNER_TEMP\pg\pgsql" | Out-File -FilePath $env:GITHUB_ENV -Append
        & "$env:RUNNER_TEMP\pg\pgsql\bin\pg_config.exe" --version

    - name: Build pgvector (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        REM Locate Visual Studio with vswhere rather than naming a path. The edition and the year
        REM are properties of the runner image, not of this build: hardcoding
        REM "2022\Enterprise" broke the moment windows-latest moved on, and broke badly — `call`
        REM to a missing batch file does NOT stop a cmd script, so the build carried on and failed
        REM later at `nmake`, pointing at the wrong thing entirely.
        set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
        if not exist "%VSWHERE%" echo Could not find vswhere.exe & exit /b 1
        for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
        if not defined VSDIR echo No Visual Studio with the C++ toolchain is installed & exit /b 1
        echo Using Visual Studio at %VSDIR%
        call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        REM Prove the toolchain is actually on PATH before trusting it, so a failure names its own
        REM cause instead of surfacing three commands later.
        where nmake >nul 2>&1 || (echo nmake is not on PATH after vcvars64 & exit /b 1)
        where cl >nul 2>&1 || (echo cl is not on PATH after vcvars64 & exit /b 1)

        git clone --branch v${{ inputs.pgvector-version }} --depth 1 https://github.com/pgvector/pgvector.git "%RUNNER_TEMP%\pgvector" || exit /b 1
        cd /d "%RUNNER_TEMP%\pgvector"
        REM PGROOT was exported by the previous step and is what Makefile.win reads.
        nmake /F Makefile.win || exit /b 1

    # Staged in PowerShell rather than with cmd's `copy`. `copy src "%DEST%\"` — a quoted path
    # ending in a backslash — is a long-standing cmd hazard, and here it silently produced files
    # holding each other's contents: vector.dll contained the control file, vector.control
    # contained the SQL. Every command reported success and the artifact was scrambled.
    - name: Stage pgvector (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $src = "$env:RUNNER_TEMP\pgvector"
        $dest = "apps/backend/src/main/resources/pgvector/windows-amd64"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        Copy-Item -LiteralPath "$src\vector.dll"     -Destination "$dest\vector.dll"     -Force
        Copy-Item -LiteralPath "$src\vector.control" -Destination "$dest\vector.control" -Force
        Copy-Item -Path "$src\sql\*.sql" -Destination $dest -Force
        (Get-ChildItem $dest -Filter *.sql).Name | Set-Content -Encoding ascii "$dest\sql-files.txt"
        Get-ChildItem $dest | Format-Table Name, Length

    # Checks that what was staged is what it claims to be.
    #
    # This exists because the build reported success while producing files that held each other's
    # contents — a compiled library named vector.control, an SQL script named vector.dll — and
    # nothing noticed until PostgreSQL refused the extension on a developer's machine. A build step
    # that cannot fail is not a check; these assertions are the check.
    - name: Verify the staged extension
      shell: bash
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS}" = "Windows" ]; then
          dir="apps/backend/src/main/resources/pgvector/windows-amd64"; lib="vector.dll"; magic="4d5a"
        else
          dir="apps/backend/src/main/resources/pgvector/linux-amd64"; lib="vector.so"; magic="7f454c46"
        fi

        fail() { echo "::error::$1"; exit 1; }

        [ -f "$dir/$lib" ] || fail "$lib is missing from $dir"
        # The shared library must actually be a shared library — PE starts 4d5a ("MZ"), ELF
        # 7f454c46. Compared as hex rather than with grep, which is not dependable on binary input.
        # This is the assertion that would have caught the scrambled artifact immediately.
        sig=$(head -c 4 "$dir/$lib" | od -An -tx1 | tr -d ' \n')
        case "$sig" in
          ${magic}*) ;;
          *) fail "$lib is not a native library — it begins ${sig}, expected ${magic}" ;;
        esac
        # A real build is hundreds of kilobytes; a text file that landed under this name is not.
        size=$(wc -c < "$dir/$lib")
        [ "$size" -gt 50000 ] || fail "$lib is only ${size} bytes, which is too small to be the compiled extension"

        [ -f "$dir/vector.control" ] || fail "vector.control is missing"
        grep -q "default_version" "$dir/vector.control" \
          || fail "vector.control does not look like a control file"

        # The install script PostgreSQL runs for a fresh CREATE EXTENSION. An upgrade script landing
        # under this name is exactly what produced "type sparsevec is only a shell" in testing.
        install_script=$(grep -o "default_version *= *'[^']*'" "$dir/vector.control" | grep -o "'[^']*'" | tr -d "'")
        [ -f "$dir/vector--${install_script}.sql" ] || fail "vector--${install_script}.sql is missing"
        grep -q "CREATE TYPE sparsevec" "$dir/vector--${install_script}.sql" \
          || fail "vector--${install_script}.sql is not the full install script"

        echo "Verified: $lib ($size bytes), vector.control, vector--${install_script}.sql"
        ls -la "$dir"

    # A file at the pgvector/ level so the platform directory survives the upload.
    #
    # upload-artifact roots the zip at the common ancestor of the files it matches. With only
    # windows-amd64/ inside, that ancestor WAS windows-amd64, so the zip contained the files at its
    # root and the platform folder vanished — and PgVectorInstaller, which looks under
    # pgvector/<platform>/, then found nothing.
    - name: Describe the payload
      shell: bash
      run: |
        cat > apps/backend/src/main/resources/pgvector/README.txt <<'EOF'
        pgvector, compiled by CI for one platform.

        Unzip this so the platform directory ends up at:
            apps/backend/src/main/resources/pgvector/<platform>/

        Then rebuild the backend jar. PgVectorInstaller copies these into the embedded PostgreSQL on
        startup and the log should say "Installed pgvector into ...". That directory is gitignored:
        it is build output, not source.
        EOF
        cat apps/backend/src/main/resources/pgvector/README.txt
