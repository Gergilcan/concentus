# The installer manifest.
#
# Scope is user, not machine: the NSIS build is perMachine:false, so it needs no elevation and no
# UAC "unknown publisher" dialog — which, together with winget skipping the browser's
# mark-of-the-web, is exactly why this channel sidesteps the SmartScreen wall an unsigned
# download hits.
#
# InstallerType nullsoft means winget already knows the silent switches (/S); declaring them
# again would only give them a second place to be wrong.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: Gergilcan.Concentus
PackageVersion: 0.1.4
InstallerLocale: en-US
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.17763.0
InstallerType: nullsoft
Scope: user
InstallModes:
  - interactive
  - silent
UpgradeBehavior: install
ReleaseDate: 2026-08-22
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/Gergilcan/concentus/releases/download/v0.1.4/Concentus-Setup-0.1.4.exe
    InstallerSha256: 8F82F2742E32A86FBDB3C4FB325246432A38659F59AD57649A5056F698CA49D6
ManifestType: installer
ManifestVersion: 1.6.0
