# Headers shared by the /api and /ws proxies. Included from default.conf.template, so it is not
# passed through envsubst — nothing here is templated.

# $proxy_host, not $host: the upstream may be a hosted backend whose router picks the service by
# Host header, and forwarding the browser's hostname there routes to the wrong service (or back to
# this one). It also sets the TLS SNI name for an https upstream.
proxy_set_header Host $proxy_host;
proxy_ssl_server_name on;

proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# Dropped deliberately (nginx omits a header set to the empty string). The browser is same-origin
# with this server, but rewriting Host above makes the pair look cross-origin to the backend, and
# Spring's CORS filter would answer 403 to every POST. CSRF protection is unaffected — that is
# enforced by the XSRF token, which this proxy passes through untouched.
proxy_set_header Origin "";
