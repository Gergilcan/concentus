<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concentus</title>
    <script>
      // Before first paint, so a light-theme user never sees a dark flash (or vice versa).
      // Dark needs no attribute — it is the stylesheet's default palette.
      try {
        var t = localStorage.getItem('ui.theme')
        if (t === 'light' || t === 'contrast') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
