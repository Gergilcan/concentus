# Desktop application profile — activated by the Electron shell (apps/desktop), never by a server
# deployment. It turns the backend from a multi-tenant web service into a single-user local process
# that belongs to whoever is sitting at the machine.
#
# The values that vary per machine are NOT here — the shell passes them on the process environment
# because only it can compute them: APP_DATA_DIR (OS app-data folder), CONCENTUS_SECRET_KEY (from
# the OS keychain), MCP_OAUTH_REDIRECT_BASE (the port it bound), CLAUDE_COMMAND and PATH (resolved
# through a login shell). Everything below is true of every desktop install.

# Marks this as the desktop build for the few places the distinction has to reach code rather than
# configuration — currently SecurityConfig, which opens the shutdown endpoint only here.
app.desktop=true

# --- The security boundary ------------------------------------------------------------------
# Loopback only. This is what replaces sign-in: with no account check in front of the API, the
# thing that stops another machine on the network driving your agents is that the socket is not
# reachable from one. Do not relax this to 0.0.0.0 without putting authentication back.
server.address=127.0.0.1

# No accounts, no organizations. There is exactly one user — the person running the app — and
# asking them to invent a password to reach a port only they can open buys nothing. Every record
# is scoped to the single organization below.
app.auth.enabled=false
app.organization-id=local
app.organization-name=Concentus

# --- Persistence ----------------------------------------------------------------------------
# Off for now: the desktop build does not yet ship a database, and requiring the user to install
# and run PostgreSQL is exactly the kind of prerequisite this packaging exists to remove. Flows,
# agents and MCP definitions are unaffected — those are file-backed under APP_DATA_DIR and survive
# a restart either way. What is lost is run history and resuming a run after a restart.
#
# Replaced by an embedded PostgreSQL started in-process (see the desktop plan, phase 2), at which
# point this becomes true again and the datasource points at APP_DATA_DIR/pgdata.
app.persistence.enabled=false

# Until then, three stores that are NOT covered by the flag above still expect a database —
# credentials, accounts and processed-mail. On a machine with no PostgreSQL each one waits out the
# full connection timeout at startup, one after another, which is most of a minute of blank window
# before anything appears. The default is tuned for a network hop to a hosted database; here the
# database is on this machine or it does not exist, so waiting ten seconds to find that out is
# time spent learning nothing.
spring.datasource.hikari.connection-timeout=${PERSIST_DB_TIMEOUT_MS:2000}

# --- Local execution ------------------------------------------------------------------------
# Context folders an agent may be pointed at. On a server this list must be an explicit opt-in,
# because a reachable deployment could otherwise be told to read any path on the host. Here the
# caller and the owner of the files are the same person, and an agent already runs with
# bypassPermissions on this machine, so defaulting to the user's home directory grants nothing
# they could not grant themselves — while still keeping system paths out of reach.
local.context-roots=${LOCAL_CONTEXT_ROOTS:${user.home}}

# --- Shutdown -------------------------------------------------------------------------------
# The shell stops the backend by POSTing to /actuator/shutdown. That is a deliberate choice over a
# signal: Windows has no SIGTERM, so the alternative is taskkill, which is a kill rather than a
# request to stop — Spring's shutdown hooks never run and in-flight run state is lost instead of
# flushed. Asking over HTTP means the same thing on every platform.
#
# This endpoint stops the application, so exposing it is only defensible because of the line at the
# top of this file: the socket is bound to 127.0.0.1, and the only thing that can reach it is
# software the user is already running.
management.endpoints.web.exposure.include=health,info,shutdown
management.endpoint.shutdown.access=unrestricted

# --- Logging --------------------------------------------------------------------------------
# There is no terminal attached to a packaged app, so the log has to land on disk for the failure
# window (and any bug report) to have something to show. The shell reads this same path.
logging.file.name=${APP_DATA_DIR:./data}/logs/backend.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
