# The port when the backend is started by hand. The desktop shell passes its own on the command
# line — 8734 by default, kept stable across launches because MCP OAuth redirect URIs are
# registered against it.
server.port=${PORT:8080}
# Load a gitignored .env from the repo root if present, so a backend run by hand picks up local
# overrides instead of needing them exported into the shell. Optional, and absent in the packaged
# app: the shell passes what it needs on the process environment, and anchors the working
# directory at the app-data folder so no stray .env is picked up. Nearest match wins, so a real
# environment variable still overrides the file.
spring.config.import=optional:file:./.env[.properties],optional:file:../../.env[.properties]
app.data-dir=${APP_DATA_DIR:./data}
# --- Stored credentials -----------------------------------------------------------
# Master key for the credentials users enter in the app (mailbox passwords, API tokens). They are
# encrypted with AES-256-GCM before being written, and no API ever returns one.
#
# Be precise about what this buys: it protects a leaked database backup, a database-only
# compromise, or a read-only SQL injection. It does NOT protect against someone who compromises
# this process or the host, because the key has to be reachable here to be usable — the secret
# does not vanish, it collapses to this one key, which is then the thing to guard.
#
# REQUIRED: the application refuses to start without it. Every credential it holds depends on this
# key, so starting without one would leave a half-working deployment — credential fields that
# silently cannot save, mail triggers quietly not polling.
#
# Generate with: openssl rand -base64 32   (32 bytes, base64)
# Changing it makes every already-stored credential unreadable; they must be re-entered.
app.secret-key=${CONCENTUS_SECRET_KEY:}
# --- Accounts, sign-in and organization isolation ---------------------------------
# The API requires an authenticated session. Where a record belongs to an organization, the id
# always comes from the authenticated principal and never from a request parameter, so no request
# can address another tenant's data.
#
# auth.enabled=false leaves the API open exactly as it was before accounts existed, and resolves
# every request to app.organization-id. Local development only — never on a reachable deployment.
app.auth.enabled=${AUTH_ENABLED:true}
# Organization used when auth is off, and the one the first administrator is created in.
app.organization-id=${APP_ORGANIZATION_ID:default}
app.organization-name=${APP_ORGANIZATION_NAME:Concentus}
# The administrator account, provisioned at startup whenever this email has no account yet — not
# only on an empty database, so setting it after the first boot still works. Leaving the password
# blank generates one and prints it to the log once. Minimum 12 characters, the same rule that
# applies to changing a password later.
app.auth.bootstrap-admin-email=${CONCENTUS_ADMIN_EMAIL:}
app.auth.bootstrap-admin-password=${CONCENTUS_ADMIN_PASSWORD:}
# An existing account's password is never overwritten from configuration — that would let anyone
# who can edit an environment variable take over a live account, and would silently undo a password
# changed in the app. Set this to true for a single run to reset a genuinely lost one, then remove it.
app.auth.bootstrap-admin-password-reset=${CONCENTUS_ADMIN_PASSWORD_RESET:false}
# Execution/auth mode:
#   auto    -> ANTHROPIC_API_KEY set: cloud (Managed Agents); else local (claude CLI / subscription)
#   api-key -> force cloud; require ANTHROPIC_API_KEY
#   local   -> force the local claude CLI on your Claude subscription login
anthropic.auth-mode=${ANTHROPIC_AUTH_MODE:auto}
# Local (claude CLI) execution:
local.claude-command=${CLAUDE_COMMAND:}
local.permission-mode=${CLAUDE_PERMISSION_MODE:bypassPermissions}
# Auto-register MCP nodes into your Claude Code list (`claude mcp add`, user scope) at run time.
# Still on with strict-mcp below: registration is what `claude mcp login` and the designer's tool
# picker need. The run itself no longer reads the user list.
local.auto-register-mcp=${LOCAL_AUTO_REGISTER_MCP:true}
# Confine each run to the MCP servers wired into ITS flow. The run gets its own --mcp-config with
# exactly the flow's servers plus --strict-mcp-config, so the user's personal MCP list — every
# server they ever registered for their own interactive work — stays out of the flow's reach, and a
# flow with no MCP nodes reaches none. false restores the old behaviour (runs inherit the user
# list), kept as an escape hatch for a server whose only working auth is a `claude mcp login`
# grant that the CLI declines to apply under strict config.
local.strict-mcp=${LOCAL_STRICT_MCP:true}
# Directories that agents' "Context folders" may point inside (comma-separated).
# Required opt-in: while empty, every configured context folder is rejected, so a
# reachable deployment can't be told to read arbitrary host paths.
local.context-roots=${LOCAL_CONTEXT_ROOTS:}
# Reusable agent library (YAML AgentSpec files); defaults to <data-dir>/agents
app.agents-dir=${APP_AGENTS_DIR:}
# --- Independent workers (a flow whose coordinator sets execution: fanout) -----------
# One `claude` process per sub-agent, in parallel. Its own pool, NOT runs.max-concurrent: the
# coordinator's turn holds a run-worker thread while it waits for its workers, so sharing one pool
# is how two concurrent fan-outs deadlock each other.
workers.max-concurrent=${WORKERS_MAX_CONCURRENT:4}
# Per worker process. The single-session path has no timeout because a human is usually watching
# one agent; a fan-out is N unattended processes, and one hung worker must not hold the whole
# turn open forever.
workers.timeout-seconds=${WORKERS_TIMEOUT_SECONDS:900}
# Retries per worker on a spawn failure or non-zero exit. Timeouts are never retried — a retried
# timeout just doubles the wall-clock spent on the same hang.
workers.retries=${WORKERS_RETRIES:1}
# Managed-agent sessions stream for a long time; don't time out async work
spring.mvc.async.request-timeout=-1
spring.jackson.default-property-inclusion=non_null
# --- Schema migrations ---
# Flyway runs, but NOT through Spring Boot's auto-configuration — SchemaMigrator invokes it as soon
# as the DataSource exists instead.
#
# The difference is what happens when the database is unreachable. The auto-configuration migrates
# during context startup and fails the application if it cannot connect, which for a server is
# correct and here is a trap: the database settings are edited inside the app, so an unreachable
# external database would mean the app never opens, locking the user out of the only screen where
# the connection can be fixed. Every store already reports itself unavailable and carries on for
# the same reason.
#
# Leaving this true is not a small mistake — it turns a wrong hostname into an app that cannot be
# started or repaired.
spring.flyway.enabled=false

# --- Run/execution persistence (PostgreSQL) ---
# Runs, their events, node outputs and session ids are stored so they survive a restart and can
# be continued. The schema is created on startup (`create table if not exists`), so an empty
# database is all that's needed.
#
# These are only consulted when the backend is run by hand against a PostgreSQL you started
# yourself. The desktop app never reads them: it activates the `desktop` profile, which supplies
# its own DataSource from the embedded server (see EmbeddedPostgresConfig) and takes precedence
# over Spring Boot's auto-configuration. Never put a real credential in this file, it is committed.
spring.datasource.url=${PERSIST_DB_URL:jdbc:postgresql://localhost:5432/concentus}
spring.datasource.username=${PERSIST_DB_USER:concentus}
spring.datasource.password=${PERSIST_DB_PASSWORD:}
# Don't fail startup if the DB is briefly unreachable — the app still runs in memory.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=${PERSIST_DB_POOL:5}
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=never
# --- Cost estimate (USD per million tokens) shown next to token counts in the UI ---
# Defaults approximate Sonnet-class pricing; adjust to the models your flows actually use.
# Runs on a Claude subscription have no per-token bill — treat this as an equivalent-usage estimate.
pricing.input-usd-per-mtok=${PRICING_INPUT_USD_PER_MTOK:3.0}
pricing.output-usd-per-mtok=${PRICING_OUTPUT_USD_PER_MTOK:15.0}
# Per-model rates (id:inputUsdPerMTok:outputUsdPerMTok, comma-separated). A flow usually mixes
# models — a coordinator on Opus delegating to sub-agents on Sonnet — so one flat rate misprices
# whichever half doesn't match. Models not listed here fall back to the two values above, and the
# model picker says so rather than showing a number that isn't real.
#
# Rates below were taken from Anthropic's published pricing page. They change; re-check rather
# than trusting these indefinitely.
#
# Cached tokens are weighted at 0.1x input, which is Anthropic's cache-read rate.
pricing.models=${PRICING_MODELS:claude-opus-4-8:5:25,claude-opus-4-7:5:25,claude-opus-4-6:5:25,claude-sonnet-5:3:15,claude-sonnet-4-6:3:15,claude-haiku-4-5:1:5,claude-fable-5:10:50}
# --- Mail-triggered flows (IMAP) -----------------------------------------------
# An Input node in "mail" mode polls an IMAP folder and starts a run per matching message.
# IMAP, not SMTP: folders, flags and read state live in the mail store, so conditions like
# "flagged, in Presupuestos" — and moving the message afterwards — only exist here.
#
# Connection details live on the node, because different flows watch different mailboxes. The
# password does not: the node stores a CREDENTIAL ID, and the secret itself is encrypted in the
# credentials table (see app.secret-key). Keeping it off the node matters because every flow save
# snapshots the flow JSON into version history, and duplicating a flow copies its nodes.
mail.triggers-enabled=${MAIL_TRIGGERS_ENABLED:true}
mail.poller-threads=${MAIL_POLLER_THREADS:2}
mail.connect-timeout-ms=${MAIL_CONNECT_TIMEOUT_MS:20000}
# The Entra app registration used to sign Microsoft 365 mailboxes in. One registration serves every
# mailbox in the deployment — it identifies the application, not the mailbox — so this belongs here
# rather than on each Input node, which may still override it for a second tenant.
#
# Neither value is a secret: a public-client id is public by design, and the tenant id is in every
# sign-in URL. The refresh token the sign-in produces is the secret, and that is encrypted in the
# credential store.
mail.microsoft.tenant-id=${MAIL_MICROSOFT_TENANT_ID:}
mail.microsoft.client-id=${MAIL_MICROSOFT_CLIENT_ID:}

# --- Self-hosted models ---------------------------------------------------------------------
# A model running on your own hardware, through any server that speaks OpenAI's /chat/completions:
# Ollama, llama.cpp's llama-server, vLLM, LM Studio. Blank disables the backend entirely — it then
# reports itself unavailable rather than failing a run.
#
# Note the /v1 suffix: Ollama's OpenAI-compatible surface is at :11434/v1, not at the root.
# The app runs on your machine, so localhost here is your machine: http://localhost:11434/v1
local-model.base-url=${LOCAL_MODEL_BASE_URL:}
# Usually blank. vLLM and LM Studio can require one; Ollama does not.
local-model.api-key=${LOCAL_MODEL_API_KEY:}
# Generous by design. A 14B model on one consumer GPU produces tens of tokens a second, and a cold
# start also loads the weights into VRAM — tens of seconds before the first byte. A timeout tuned
# for a hosted API turns a working setup into intermittent failures.
local-model.request-timeout-seconds=${LOCAL_MODEL_TIMEOUT_SECONDS:900}
# Caps how many tool-calling rounds one agent may take before it has to answer. Smaller models
# lose the thread and call the same tool repeatedly; this is what stops that being an endless loop.
local-model.max-turns-per-agent=${LOCAL_MODEL_MAX_TURNS:12}
# Caps how many MCP tools one agent is handed. 0 = no cap, and that is the default: dropping tools
# silently is worse than a large prompt, and every run now prints exactly which tools it sent, which
# it did not and why. Set a number only if you want a hard ceiling.
#
# The number that actually decides whether a run works is the model server's context length, not
# this. Ollama serves 2048 by default whatever the model supports, and truncates past it without
# saying so: OLLAMA_CONTEXT_LENGTH=32768 ollama serve
local-model.max-tools-per-agent=${LOCAL_MODEL_MAX_TOOLS:0}

# --- Attachment handling -------------------------------------------------------
# Attachments arrive from unauthenticated senders, so these are resource bounds rather than
# preferences. Executables, macro-enabled Office files and archives are refused by content, not by
# file extension — the sender controls the name and the declared MIME type, so neither is evidence.
integration.attachments.max-bytes=${ATTACHMENT_MAX_BYTES:10485760}
integration.attachments.max-total-bytes=${ATTACHMENT_MAX_TOTAL_BYTES:31457280}
integration.attachments.max-count=${ATTACHMENT_MAX_COUNT:15}
integration.attachments.max-spreadsheet-rows=${ATTACHMENT_MAX_SPREADSHEET_ROWS:2000}
# OCR needs the native tesseract library and language data. When they are missing the extractor
# reports itself unavailable and image attachments are simply skipped — the app still starts.
integration.attachments.ocr-enabled=${OCR_ENABLED:true}
integration.attachments.ocr-languages=${OCR_LANGUAGES:spa+eng}
integration.attachments.ocr-data-path=${OCR_DATA_PATH:}
integration.attachments.max-ocr-pages=${OCR_MAX_PDF_PAGES:10}
logging.level.com.concentus=INFO
# --- RAG / SQL source security (SSRF guard) ---
# The secret-exfiltration half of this guard is gone: a SQL node now references a credential id
# rather than naming an environment variable, so there is no arbitrary variable to point it at.
# JDBC drivers (the jdbc:<driver>://... scheme) a SQL RAG source may target. Only the bundled
# PostgreSQL driver is allowed by default; add others (comma-separated) as their drivers are added.
rag.allowed-jdbc-drivers=${RAG_ALLOWED_JDBC_DRIVERS:postgresql}
# Extra hosts (hostnames or IPs, comma-separated) a SQL RAG source may target beyond normal
# public/internal hosts. Loopback, link-local, and cloud metadata hosts (169.254.169.254) are
# blocked even if not listed here, unless explicitly added to this list.
rag.allowed-jdbc-hosts=${RAG_ALLOWED_JDBC_HOSTS:}
# --- Run registry / executor bounds (WIR-9: cap unbounded memory/thread growth) ---
# Max concurrent local/cloud run turns executed at once (core=max threads in the run-worker pool).
runs.max-concurrent=${RUNS_MAX_CONCURRENT:8}
# Queued run submissions allowed beyond max-concurrent before new ones are rejected
# (RejectedExecutionException -> run is failed with a "try again shortly" message).
runs.queue-capacity=${RUNS_QUEUE_CAPACITY:64}
# Max runs kept in the in-memory registry. Once exceeded, oldest completed (TERMINATED/ERROR)
# runs are evicted first; active/running runs are never evicted.
runs.max-retained=${RUNS_MAX_RETAINED:200}
# Actuator: expose only health + info; everything else (env, beans, heapdump, ...) stays off.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# --- Git repositories --------------------------------------------------------------
# A repository node is cloned into the run's own working directory, which is already the CLI's cwd
# — so the checkout is simply there, needing no --add-dir grant and no entry in
# local.context-roots. One clone per run, because two runs of the same mail-triggered flow can
# overlap and a shared working tree would have them writing over each other's branch.
#
# The push credential is passed on the CLI process environment, never written into .git/config or
# a remote URL. That keeps it off disk and out of `git remote -v`; it does not hide it from an
# agent running with bypassPermissions, so scope the token to these repositories and do not reuse
# a credential that has any other reach.
git.clone-enabled=${GIT_CLONE_ENABLED:true}
git.clone-timeout-seconds=${GIT_CLONE_TIMEOUT_SECONDS:300}
# 0 = full history. A shallow clone is faster but has awkward edges when pushing a new branch.
git.clone-depth=${GIT_CLONE_DEPTH:0}
git.api-timeout-seconds=${GIT_API_TIMEOUT_SECONDS:30}
# A repository node can name a whole GitHub organization or GitLab group instead of one URL, in
# which case every repository inside it is cloned — resolved when the run starts, so a repository
# added to the group later is picked up without editing the flow. This caps how many one node may
# expand to: a hundred clones would take longer than the run and fill the disk. Going over is
# logged and told to the agent, never silently truncated.
git.max-group-repos=${GIT_MAX_GROUP_REPOS:25}

# Where an MCP OAuth sign-in redirects back to. Must be the address YOUR BROWSER uses to reach
# Concentus, and it is registered with the authorization server, so changing it means signing in
# again. The desktop shell overrides this with the port it actually bound, and keeps that port
# stable across launches for exactly this reason.
mcp.oauth.redirect-base=${MCP_OAUTH_REDIRECT_BASE:http://127.0.0.1:8734}

# There is no CORS configuration any more, because there is no longer a cross-origin request to
# configure for: the UI is served from inside the backend jar, so the page, /api and /ws share one
# origin and the browser never sends a preflight. That is also why the nginx container and the
# dev-server proxy are gone rather than ported.

# --- MCP tool search (RAG over tool definitions) ----------------------------------------------
# Above this many tools on one server, the agent is given a single search_<server>_tools instead of
# every definition. It describes what it needs, gets back the few matching schemas, and calls the
# tool by name — every tool stays callable, only the catalogue stops being carried in the prompt.
#
# A threshold rather than a switch: for eight tools, search is pure overhead (an extra round trip
# before anything happens); for three hundred it is the only thing that fits. 0 disables it.
# A selection made with the tool picker on a node always wins — that was an explicit choice.
local-model.tool-search-threshold=${LOCAL_MODEL_TOOL_SEARCH_THRESHOLD:25}
local-model.tool-search-enabled=${LOCAL_MODEL_TOOL_SEARCH:true}
# Embedding model for the ranking, served by the same local server. It must be an EMBEDDING model:
# a chat model returns a 404 or nonsense depending on the runner.  ollama pull bge-m3
#
# Ranking degrades to word overlap without pgvector or without this model — worse, still useful,
# and the run says which one it used. Semantic ranking is what connects "who are my customers" to
# list_contacts, a phrase sharing no word with the tool's name.
local-model.embedding-model=${LOCAL_MODEL_EMBEDDING_MODEL:bge-m3}
